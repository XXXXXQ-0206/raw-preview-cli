name: Bug report
description: Report a reproducible problem with RawPreview CLI
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach photos, credentials, private DLLs, or machine-specific logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Photos versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include sanitized commands and doctor output.
    validations:
      required: true
