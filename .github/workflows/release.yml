name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Publish CLI
        run: dotnet publish src/RawPreview.Cli/RawPreview.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/cli-${{ matrix.rid }}
      - name: Publish Worker
        run: dotnet publish src/RawPreview.Worker/RawPreview.Worker.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/worker-${{ matrix.rid }}
      - name: Package and verify release bundle
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = $env:RID -replace '^win-', ''
          $cliDirectory = "artifacts/cli-$env:RID"
          $workerDirectory = "artifacts/worker-$env:RID"
          $bundleDirectory = "artifacts/bundle-$env:RID"
          $zipFile = "rawpreview-$env:RID.zip"

          Get-ChildItem -LiteralPath $cliDirectory -Filter '*.pdb' -File | Remove-Item -Force
          Get-ChildItem -LiteralPath $workerDirectory -Filter '*.pdb' -File | Remove-Item -Force
          New-Item -ItemType Directory -Force -Path "$bundleDirectory/worker" | Out-Null
          Get-ChildItem -LiteralPath $cliDirectory -Force | Copy-Item -Destination $bundleDirectory -Recurse
          Get-ChildItem -LiteralPath $workerDirectory -Force | Copy-Item -Destination "$bundleDirectory/worker" -Recurse
          Copy-Item -LiteralPath README.md -Destination "$bundleDirectory/README.md"
          Copy-Item -LiteralPath LICENSE -Destination "$bundleDirectory/LICENSE"
          Copy-Item -LiteralPath scripts/install-worker.ps1 -Destination "$bundleDirectory/install-worker.ps1"

          [xml]$manifest = Get-Content -LiteralPath packaging/RawPreview.Worker/AppxManifest.xml -Raw
          $namespace = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $namespace.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/appx:Package/appx:Identity', $namespace)
          if ($null -eq $identity) { throw 'Appx manifest identity was not found.' }
          $identity.SetAttribute('ProcessorArchitecture', $architecture)
          $manifestPath = "$bundleDirectory/AppxManifest.xml"
          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try { $manifest.Save($writer) } finally { $writer.Dispose() }

          [xml]$writtenManifest = Get-Content -LiteralPath $manifestPath -Raw
          $writtenNamespace = [System.Xml.XmlNamespaceManager]::new($writtenManifest.NameTable)
          $writtenNamespace.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $writtenIdentity = $writtenManifest.SelectSingleNode('/appx:Package/appx:Identity', $writtenNamespace)
          if ($writtenIdentity.ProcessorArchitecture -ne $architecture) { throw "Manifest architecture mismatch: expected $architecture." }

          $requiredPaths = @(
            "$bundleDirectory/rawpreview.exe",
            "$bundleDirectory/worker/RawPreview.Worker.exe",
            "$bundleDirectory/install-worker.ps1",
            "$bundleDirectory/AppxManifest.xml",
            "$bundleDirectory/README.md",
            "$bundleDirectory/LICENSE"
          )
          $missingPaths = @($requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingPaths.Count -gt 0) { throw "Bundle is missing: $($missingPaths -join ', ')" }
          $prohibitedPayload = @(Get-ChildItem -LiteralPath $bundleDirectory -Recurse -File | Where-Object { $_.Name -match '^(Photos.*\.(dll|winmd)|msRAWImage_store\.dll|.*\.(arw|jpe?g|png))$' })
          if ($prohibitedPayload.Count -gt 0) { throw "Bundle contains prohibited payload: $($prohibitedPayload.FullName -join ', ')" }

          Compress-Archive -Path (Join-Path $bundleDirectory '*') -DestinationPath $zipFile
          $hash = (Get-FileHash -LiteralPath $zipFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$zipFile" | Set-Content -LiteralPath "$zipFile.sha256" -Encoding ascii -NoNewline
      - name: Attest release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: rawpreview-${{ matrix.rid }}.zip
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rawpreview-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            rawpreview-${{ matrix.rid }}.zip
            rawpreview-${{ matrix.rid }}.zip.sha256

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/rawpreview-*.zip)
          [ "${#assets[@]}" -eq 2 ]
          for asset in "${assets[@]}"; do
            test -f "$asset.sha256"
            (cd release-assets && sha256sum -c "$(basename "$asset").sha256")
          done
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## Highlights

            - Initial public release of the Windows Photos-backed Sony ARW to JPEG exporter.
            - Includes self-contained CLI and Worker bundles for x64 and ARM64 Windows.
            - Each archive has a SHA-256 checksum and GitHub build provenance attestation.

            ## Requirements

            Microsoft Photos and Microsoft Raw Image Extension must be installed locally. This release does not redistribute Microsoft binaries.

            See the README for installation, usage, and compatibility notes.
          files: |
            release-assets/rawpreview-*.zip
            release-assets/rawpreview-*.zip.sha256
